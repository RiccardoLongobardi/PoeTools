<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOB — Frusta Oracle Builder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 800px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        
        .search-box {
            margin-bottom: 20px;
        }
        
        input[type="text"] {
            width: 100%;
            padding: 15px 20px;
            font-size: 1.1em;
            border: 2px solid #ddd;
            border-radius: 10px;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .examples {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        
        .example-btn {
            padding: 8px 16px;
            background: #f0f0f0;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s;
        }
        
        .example-btn:hover {
            background: #667eea;
            color: white;
        }
        
        button[type="submit"] {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        button[type="submit"]:hover {
            transform: translateY(-2px);
        }
        
        .results {
            margin-top: 30px;
        }
        
        .build-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }
        
        .build-title {
            font-size: 1.3em;
            color: #333;
            margin-bottom: 10px;
        }
        
        .build-info {
            color: #666;
            margin-bottom: 8px;
        }
        
        .score {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.9em;
            margin-top: 10px;
        }
        
        .loading {
            text-align: center;
            color: #667eea;
            font-size: 1.2em;
            margin-top: 20px;
        }
        
        .error {
            background: #fee;
            border-left-color: #f44;
            color: #c33;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔮 FOB Oracle</h1>
        <p class="subtitle">Trova la build perfetta per il tuo stile di gioco</p>
        
        <form id="searchForm">
            <div class="search-box">
                <input type="text" id="query" placeholder="Es: voglio una build che ghiacci tutto" required>
            </div>
            
            <div class="examples">
                <button type="button" class="example-btn" data-query="mi piace il ghiaccio">❄️ Ghiaccio</button>
                <button type="button" class="example-btn" data-query="voglio slammare forte">🔨 Slam</button>
                <button type="button" class="example-btn" data-query="damage over time">🔥 DOT</button>
                <button type="button" class="example-btn" data-query="minions">👻 Minions</button>
            </div>
            
            <button type="submit">Cerca Build</button>
        </form>
        
        <div id="results" class="results"></div>
    </div>
    
    <script>
        const form = document.getElementById('searchForm');
        const queryInput = document.getElementById('query');
        const resultsDiv = document.getElementById('results');
        const exampleButtons = document.querySelectorAll('.example-btn');
        
        // Esempi quick
        exampleButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                queryInput.value = btn.dataset.query;
            });
        });
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const query = queryInput.value;
            resultsDiv.innerHTML = '<div class="loading">🔍 Ricerca in corso...</div>';
            
            try {
                // Usa URL relativo invece di localhost:8000
                const response = await fetch('/fob/oracle', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ query: query })
                });
                
                if (!response.ok) {
                    throw new Error('Errore nella ricerca');
                }
                
                const data = await response.json();
                displayResults(data);
                
            } catch (error) {
                resultsDiv.innerHTML = `
                    <div class="build-card error">
                        <div class="build-title">❌ Errore</div>
                        <p>Errore durante la ricerca. Assicurati che il server sia avviato.</p>
                    </div>
                `;
            }
        });
        
        function displayResults(data) {
            if (!data.candidates || data.candidates.length === 0) {
                resultsDiv.innerHTML = `
                    <div class="build-card">
                        <div class="build-title">Nessun risultato</div>
                        <p>Prova con una ricerca diversa</p>
                    </div>
                `;
                return;
            }
            
            let html = '<h2 style="margin-bottom: 20px; color: #333;">Build trovate:</h2>';
            
            data.candidates.forEach((build, index) => {
                html += `
                    <div class="build-card">
                        <div class="build-title">${index + 1}. ${build.name}</div>
                        <div class="build-info"><strong>Classe:</strong> ${build.class_name || 'N/A'}</div>
                        <div class="build-info"><strong>Skill principale:</strong> ${build.main_skill || 'N/A'}</div>
                        <div class="build-info"><strong>Archetype:</strong> ${build.archetype || 'Generic'}</div>
                        ${build.source ? `<div class="build-info"><strong>Source:</strong> ${build.source}</div>` : ''}
                        <span class="score">Score: ${build.score.toFixed(2)}</span>
                    </div>
                `;
            });
            
            resultsDiv.innerHTML = html;
        }
    </script>
</body>
</html>
