<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FOB Oracle — Frusta Oracle Builder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --text-xs: clamp(0.75rem, 0.7rem + 0.25vw, 0.875rem);
      --text-sm: clamp(0.875rem, 0.8rem + 0.35vw, 1rem);
      --text-base: clamp(1rem, 0.95rem + 0.25vw, 1.125rem);
      --text-lg: clamp(1.125rem, 1rem + 0.75vw, 1.5rem);
      --text-xl: clamp(1.5rem, 1.2rem + 1.25vw, 2.25rem);
      --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem; --space-4: 1rem;
      --space-5: 1.25rem; --space-6: 1.5rem; --space-8: 2rem; --space-10: 2.5rem;
      --space-12: 3rem; --space-16: 4rem;
      --radius-sm: 0.375rem; --radius-md: 0.5rem; --radius-lg: 0.75rem; --radius-xl: 1rem; --radius-full: 9999px;
      --transition: 180ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    [data-theme="dark"] {
      --bg: #0f0f0f;
      --surface: #161616;
      --surface-2: #1c1c1c;
      --surface-3: #222;
      --border: rgba(255,255,255,0.08);
      --text: #e8e8e6;
      --text-muted: #888;
      --text-faint: #555;
      --primary: #c89b3c;
      --primary-hover: #ddb04e;
      --primary-dim: rgba(200,155,60,0.12);
      --error: #e05252;
      --success: #5c9e6e;
      --warning: #d4904a;
      --tag-bg: rgba(200,155,60,0.1);
      --tag-border: rgba(200,155,60,0.25);
    }
    [data-theme="light"] {
      --bg: #f5f3ef;
      --surface: #faf9f6;
      --surface-2: #fff;
      --surface-3: #f0ede8;
      --border: rgba(0,0,0,0.1);
      --text: #1a1a18;
      --text-muted: #666;
      --text-faint: #aaa;
      --primary: #9a6e1a;
      --primary-hover: #7c5512;
      --primary-dim: rgba(154,110,26,0.1);
      --error: #b83232;
      --success: #3a7a4e;
      --warning: #a8640e;
      --tag-bg: rgba(154,110,26,0.08);
      --tag-border: rgba(154,110,26,0.2);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-font-smoothing: antialiased; scroll-behavior: smooth; }
    body { font-family: 'Inter', sans-serif; font-size: var(--text-base); color: var(--text); background: var(--bg); min-height: 100dvh; }
    a, button, input, select { transition: color var(--transition), background var(--transition), border-color var(--transition), box-shadow var(--transition); }
    button { cursor: pointer; background: none; border: none; font: inherit; color: inherit; }
    input { font: inherit; color: inherit; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }

    /* Layout */
    .app { display: grid; grid-template-rows: auto 1fr; min-height: 100dvh; }
    header { background: var(--surface); border-bottom: 1px solid var(--border); padding: var(--space-4) var(--space-8); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
    .logo { display: flex; align-items: center; gap: var(--space-3); }
    .logo svg { color: var(--primary); }
    .logo-text { font-size: var(--text-lg); font-weight: 700; letter-spacing: -0.02em; }
    .logo-sub { font-size: var(--text-xs); color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }
    .header-actions { display: flex; align-items: center; gap: var(--space-3); }
    .theme-btn { padding: var(--space-2); border-radius: var(--radius-md); color: var(--text-muted); }
    .theme-btn:hover { color: var(--text); background: var(--surface-2); }

    main { padding: var(--space-8); max-width: 1200px; margin: 0 auto; width: 100%; }

    /* Query box */
    .query-section { margin-bottom: var(--space-8); }
    .query-label { font-size: var(--text-sm); color: var(--text-muted); margin-bottom: var(--space-2); }
    .query-row { display: flex; gap: var(--space-3); }
    .query-input { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: var(--space-4) var(--space-5); font-size: var(--text-base); color: var(--text); outline: none; }
    .query-input::placeholder { color: var(--text-faint); }
    .query-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-dim); }
    .query-btn { background: var(--primary); color: #0f0f0f; font-weight: 600; padding: var(--space-4) var(--space-8); border-radius: var(--radius-lg); font-size: var(--text-sm); white-space: nowrap; }
    .query-btn:hover { background: var(--primary-hover); }
    .query-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .league-badge { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-full); padding: var(--space-1) var(--space-3); font-size: var(--text-xs); color: var(--primary); font-family: 'JetBrains Mono', monospace; align-self: center; white-space: nowrap; }

    /* Tabs */
    .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: var(--space-6); }
    .tab { padding: var(--space-3) var(--space-6); font-size: var(--text-sm); font-weight: 500; color: var(--text-muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--primary); border-bottom-color: var(--primary); }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* Intent bar */
    .intent-bar { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: var(--space-4) var(--space-5); margin-bottom: var(--space-6); display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; }
    .intent-label { font-size: var(--text-xs); color: var(--text-muted); font-family: 'JetBrains Mono', monospace; margin-right: var(--space-2); }
    .tag { background: var(--tag-bg); border: 1px solid var(--tag-border); color: var(--primary); border-radius: var(--radius-full); padding: 2px var(--space-3); font-size: var(--text-xs); font-family: 'JetBrains Mono', monospace; }
    .tag.neutral { background: var(--surface-2); border-color: var(--border); color: var(--text-muted); }
    .intent-hidden { display: none; }

    /* Build grid */
    .builds-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(340px, 100%), 1fr)); gap: var(--space-4); }
    .build-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-xl); padding: var(--space-5); cursor: pointer; position: relative; }
    .build-card:hover { border-color: rgba(200,155,60,0.35); box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
    .build-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: var(--space-3); }
    .build-name { font-size: var(--text-base); font-weight: 600; line-height: 1.3; }
    .build-score { font-family: 'JetBrains Mono', monospace; font-size: var(--text-xs); color: var(--primary); background: var(--primary-dim); padding: 2px var(--space-2); border-radius: var(--radius-sm); white-space: nowrap; }
    .build-meta { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-bottom: var(--space-3); }
    .build-badge { font-size: var(--text-xs); padding: 2px var(--space-2); border-radius: var(--radius-sm); border: 1px solid var(--border); color: var(--text-muted); }
    .build-tags { display: flex; flex-wrap: wrap; gap: var(--space-1); margin-bottom: var(--space-3); }
    .build-footer { display: flex; justify-content: space-between; align-items: center; }
    .build-source { font-size: var(--text-xs); color: var(--text-faint); font-family: 'JetBrains Mono', monospace; }
    .build-link { font-size: var(--text-xs); color: var(--primary); text-decoration: none; }
    .build-link:hover { text-decoration: underline; }
    .match-detail { font-size: var(--text-xs); color: var(--text-faint); font-family: 'JetBrains Mono', monospace; margin-top: var(--space-2); }

    /* Detail panel */
    .detail-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 50; display: none; align-items: flex-start; justify-content: flex-end; padding: var(--space-4); }
    .detail-overlay.open { display: flex; }
    .detail-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-xl); width: min(600px, 100%); max-height: calc(100dvh - var(--space-8)); overflow-y: auto; padding: var(--space-8); }
    .detail-close { position: absolute; top: var(--space-4); right: var(--space-4); color: var(--text-muted); padding: var(--space-2); border-radius: var(--radius-md); }
    .detail-close:hover { color: var(--text); background: var(--surface-2); }
    .detail-title { font-size: var(--text-xl); font-weight: 700; margin-bottom: var(--space-2); }
    .detail-section { margin-top: var(--space-6); }
    .detail-section h3 { font-size: var(--text-sm); text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); margin-bottom: var(--space-3); }
    .detail-section p, .detail-section li { font-size: var(--text-sm); color: var(--text-muted); line-height: 1.7; }
    .detail-section ul { padding-left: var(--space-5); }
    .detail-section li { margin-bottom: var(--space-1); }

    /* Admin panel */
    .admin-section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-xl); padding: var(--space-6); }
    .admin-title { font-size: var(--text-base); font-weight: 600; margin-bottom: var(--space-6); }
    .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); margin-bottom: var(--space-6); }
    @media (max-width: 600px) { .admin-grid { grid-template-columns: 1fr; } }
    .source-card { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: var(--space-4); }
    .source-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-2); }
    .source-name { font-family: 'JetBrains Mono', monospace; font-size: var(--text-sm); font-weight: 600; }
    .status-dot { width: 8px; height: 8px; border-radius: var(--radius-full); background: var(--text-faint); }
    .status-dot.ok { background: var(--success); }
    .status-dot.error { background: var(--error); }
    .status-dot.running { background: var(--warning); animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .source-meta { font-size: var(--text-xs); color: var(--text-faint); margin-bottom: var(--space-3); }
    .source-refresh-btn { font-size: var(--text-xs); color: var(--primary); border: 1px solid var(--tag-border); border-radius: var(--radius-sm); padding: 2px var(--space-3); }
    .source-refresh-btn:hover { background: var(--primary-dim); }
    .admin-row { display: flex; gap: var(--space-3); align-items: center; margin-bottom: var(--space-4); }
    .admin-btn { background: var(--primary); color: #0f0f0f; font-weight: 600; padding: var(--space-3) var(--space-6); border-radius: var(--radius-lg); font-size: var(--text-sm); }
    .admin-btn:hover { background: var(--primary-hover); }
    .admin-btn.secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
    .admin-btn.secondary:hover { border-color: var(--primary); color: var(--primary); }
    .log-box { background: var(--surface-3); border: 1px solid var(--border); border-radius: var(--radius-md); padding: var(--space-4); font-family: 'JetBrains Mono', monospace; font-size: var(--text-xs); color: var(--text-muted); min-height: 100px; white-space: pre-wrap; max-height: 300px; overflow-y: auto; }
    .admin-creds { display: flex; gap: var(--space-3); margin-bottom: var(--space-4); }
    .admin-creds input { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-md); padding: var(--space-2) var(--space-3); font-size: var(--text-sm); flex: 1; }
    .admin-creds input:focus { outline: none; border-color: var(--primary); }

    /* Empty / warning states */
    .empty { text-align: center; padding: var(--space-16) var(--space-8); color: var(--text-muted); }
    .empty p { margin-top: var(--space-2); font-size: var(--text-sm); }
    .warning-bar { background: rgba(212,144,74,0.12); border: 1px solid rgba(212,144,74,0.3); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); font-size: var(--text-sm); color: var(--warning); margin-bottom: var(--space-4); display: none; }
    .warning-bar.visible { display: block; }

    /* Skeleton */
    @keyframes shimmer { 0%{background-position:-200% 0} 100%{background-position:200% 0} }
    .skeleton { background: linear-gradient(90deg, var(--surface-2) 25%, var(--surface-3) 50%, var(--surface-2) 75%); background-size: 200% 100%; animation: shimmer 1.5s ease-in-out infinite; border-radius: var(--radius-sm); }
    .skeleton-card { height: 160px; border-radius: var(--radius-xl); }

    /* Responsive */
    @media (max-width: 768px) {
      main { padding: var(--space-4); }
      header { padding: var(--space-3) var(--space-4); }
      .query-row { flex-direction: column; }
      .detail-panel { width: 100%; }
    }
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-label="FOB Oracle logo">
        <circle cx="14" cy="14" r="12" stroke="currentColor" stroke-width="1.5"/>
        <path d="M14 6 L17 12 L23 13 L18.5 17.5 L19.5 23.5 L14 21 L8.5 23.5 L9.5 17.5 L5 13 L11 12 Z" stroke="currentColor" stroke-width="1.5" fill="none"/>
      </svg>
      <div>
        <div class="logo-text">FOB Oracle</div>
        <div class="logo-sub">Frusta Oracle Builder</div>
      </div>
    </div>
    <div class="header-actions">
      <span class="league-badge">Mirage</span>
      <button class="theme-btn" data-theme-toggle aria-label="Switch theme">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </header>

  <main>
    <!-- Query -->
    <section class="query-section">
      <div class="query-label">Descrivi la build che vuoi — in italiano o inglese</div>
      <div class="query-row">
        <input
          class="query-input"
          id="queryInput"
          type="text"
          placeholder="es: voglio una build che slammi forte con una mazza, non troppo costosa…"
          autocomplete="off"
        />
        <button class="query-btn" id="queryBtn" onclick="runQuery()">Cerca build</button>
      </div>
    </section>

    <!-- Intent bar -->
    <div class="intent-bar intent-hidden" id="intentBar">
      <span class="intent-label">intent:</span>
      <span id="intentTags"></span>
    </div>

    <!-- Warning -->
    <div class="warning-bar" id="warningBar"></div>

    <!-- Tabs -->
    <nav class="tabs" role="tablist">
      <button class="tab active" role="tab" onclick="switchTab('meta')" id="tab-meta">Meta builds</button>
      <button class="tab" role="tab" onclick="switchTab('guide')" id="tab-guide">Guide builds</button>
      <button class="tab" role="tab" onclick="switchTab('admin')" id="tab-admin">Refresh / Status</button>
    </nav>

    <!-- Meta builds -->
    <div class="tab-panel active" id="panel-meta">
      <div id="metaBuilds" class="builds-grid"></div>
    </div>

    <!-- Guide builds -->
    <div class="tab-panel" id="panel-guide">
      <div id="guideBuilds" class="builds-grid"></div>
    </div>

    <!-- Admin -->
    <div class="tab-panel" id="panel-admin">
      <div class="admin-section">
        <div class="admin-title">Refresh Cache</div>
        <div class="admin-creds">
          <input id="adminUser" type="text" placeholder="username" value="admin" />
          <input id="adminPass" type="password" placeholder="password" value="fob" />
        </div>
        <div class="admin-grid" id="sourceCards"></div>
        <div class="admin-row">
          <button class="admin-btn" onclick="triggerRefresh(null)">Refresh all sources</button>
          <button class="admin-btn secondary" onclick="loadCacheStatus()">Aggiorna status</button>
        </div>
        <div class="log-box" id="adminLog">// Output refresh apparirà qui…</div>
      </div>
    </div>
  </main>
</div>

<!-- Build detail overlay -->
<div class="detail-overlay" id="detailOverlay" onclick="closeDetail(event)">
  <div class="detail-panel" id="detailPanel">
    <button class="detail-close" onclick="closeDetailPanel()" aria-label="Chiudi">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <div id="detailContent"></div>
  </div>
</div>

<script>
const API_BASE = window.location.origin;
const LEAGUE = 'Mirage';
let allBuilds = [];

// Theme toggle
(function(){
  const t = document.querySelector('[data-theme-toggle]');
  const r = document.documentElement;
  let d = r.getAttribute('data-theme') || 'dark';
  t && t.addEventListener('click', () => {
    d = d === 'dark' ? 'light' : 'dark';
    r.setAttribute('data-theme', d);
  });
})();

// Tabs
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  document.getElementById('panel-' + name).classList.add('active');
  if (name === 'admin') loadCacheStatus();
}

// Query
async function runQuery() {
  const q = document.getElementById('queryInput').value.trim();
  if (!q) return;
  const btn = document.getElementById('queryBtn');
  btn.disabled = true;
  btn.textContent = 'Ricerca…';
  showSkeletons('metaBuilds');
  showSkeletons('guideBuilds');
  document.getElementById('intentBar').classList.add('intent-hidden');
  document.getElementById('warningBar').classList.remove('visible');

  try {
    const res = await fetch(`${API_BASE}/fob/oracle`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query: q, league: LEAGUE }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    allBuilds = data.builds || [];
    renderIntent(data.intent);
    renderWarning(data.warning);
    renderBuilds('metaBuilds', allBuilds.filter(b => b.source === 'ladder' || b.signals?.is_ladder_build));
    renderBuilds('guideBuilds', allBuilds.filter(b => !b.signals?.is_ladder_build));
  } catch (e) {
    document.getElementById('metaBuilds').innerHTML = `<div class="empty"><p>Errore: ${e.message}</p></div>`;
    document.getElementById('guideBuilds').innerHTML = '';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Cerca build';
  }
}

document.getElementById('queryInput').addEventListener('keydown', e => { if (e.key === 'Enter') runQuery(); });

function renderIntent(intent) {
  if (!intent) return;
  const bar = document.getElementById('intentBar');
  const tags = document.getElementById('intentTags');
  const items = [
    ...(intent.damage_type || []).map(t => `<span class="tag">${t}</span>`),
    ...(intent.playstyle || []).map(t => `<span class="tag">${t}</span>`),
    ...(intent.element || []).map(t => `<span class="tag">${t}</span>`),
    intent.budget !== 'any' ? `<span class="tag neutral">${intent.budget}</span>` : '',
  ].filter(Boolean);
  if (items.length) {
    tags.innerHTML = items.join('');
    bar.classList.remove('intent-hidden');
  }
}

function renderWarning(w) {
  const bar = document.getElementById('warningBar');
  if (w) { bar.textContent = '⚠ ' + w; bar.classList.add('visible'); }
  else bar.classList.remove('visible');
}

function renderBuilds(containerId, builds) {
  const el = document.getElementById(containerId);
  if (!builds.length) {
    el.innerHTML = '<div class="empty"><p>Nessuna build trovata per questa query.</p></div>';
    return;
  }
  el.innerHTML = builds.map((b, i) => buildCard(b, i)).join('');
}

function buildCard(b, i) {
  const matchStr = b.match_detail ? Object.entries(b.match_detail).map(([k,v]) => `${k}: ${Array.isArray(v) ? v.join(',') : v}`).join(' · ') : '';
  const tags = [...(b.element || []), ...(b.damage_type || []), ...(b.playstyle || [])].map(t => `<span class="tag">${t}</span>`).join('');
  return `
    <div class="build-card" onclick="openDetail(${i})" data-idx="${i}">
      <div class="build-card-header">
        <div class="build-name">${esc(b.name)}</div>
        <span class="build-score">⬡ ${b.score ?? 0}</span>
      </div>
      <div class="build-meta">
        ${b.ascendancy ? `<span class="build-badge">${esc(b.ascendancy)}</span>` : ''}
        ${b.main_skill ? `<span class="build-badge">${esc(b.main_skill)}</span>` : ''}
      </div>
      <div class="build-tags">${tags}</div>
      ${matchStr ? `<div class="match-detail">match: ${esc(matchStr)}</div>` : ''}
      <div class="build-footer">
        <span class="build-source">${esc(b.source)}</span>
        ${b.url ? `<a class="build-link" href="${esc(b.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">↗ apri</a>` : ''}
      </div>
    </div>`;
}

// Detail
function openDetail(idx) {
  const b = allBuilds[idx];
  if (!b) return;
  const g = b.guide || {};
  document.getElementById('detailContent').innerHTML = `
    <div class="detail-title">${esc(b.name)}</div>
    <div class="build-meta" style="margin-bottom:var(--space-4)">
      ${b.ascendancy ? `<span class="build-badge">${esc(b.ascendancy)}</span>` : ''}
      ${b.main_skill ? `<span class="build-badge">${esc(b.main_skill)}</span>` : ''}
      <span class="build-badge">${esc(b.source)}</span>
      ${b.url ? `<a class="build-link" href="${esc(b.url)}" target="_blank" rel="noopener">↗ link originale</a>` : ''}
    </div>
    ${g.summary ? `<div class="detail-section"><h3>Descrizione</h3><p>${esc(g.summary)}</p></div>` : ''}
    ${g.pros?.length ? `<div class="detail-section"><h3>Pro</h3><ul>${g.pros.map(p => `<li>${esc(p)}</li>`).join('')}</ul></div>` : ''}
    ${g.cons?.length ? `<div class="detail-section"><h3>Contro</h3><ul>${g.cons.map(c => `<li>${esc(c)}</li>`).join('')}</ul></div>` : ''}
    ${g.levelling?.length ? `<div class="detail-section"><h3>Levelling</h3><ul>${g.levelling.map(l => `<li>${esc(l)}</li>`).join('')}</ul></div>` : ''}
    ${g.gear?.length ? `<div class="detail-section"><h3>Gear</h3><ul>${g.gear.map(gp => `<li>${esc(gp)}</li>`).join('')}</ul></div>` : ''}
    ${g.notes ? `<div class="detail-section"><h3>Note</h3><p>${esc(g.notes)}</p></div>` : ''}
    ${b.raw?.raw_text ? `<div class="detail-section"><h3>Raw text</h3><p style="font-family:monospace;font-size:0.75rem;white-space:pre-wrap;opacity:0.5">${esc(b.raw.raw_text.slice(0, 800))}${b.raw.raw_text.length > 800 ? '…' : ''}</p></div>` : ''}
  `;
  document.getElementById('detailOverlay').classList.add('open');
}
function closeDetail(e) { if (e.target === document.getElementById('detailOverlay')) closeDetailPanel(); }
function closeDetailPanel() { document.getElementById('detailOverlay').classList.remove('open'); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDetailPanel(); });

// Skeleton
function showSkeletons(id) {
  document.getElementById(id).innerHTML = Array(4).fill('<div class="skeleton skeleton-card"></div>').join('');
}

// Admin
function adminHeaders() {
  const u = document.getElementById('adminUser').value;
  const p = document.getElementById('adminPass').value;
  return { 'Content-Type': 'application/json', 'Authorization': 'Basic ' + btoa(u + ':' + p) };
}

async function loadCacheStatus() {
  const log = document.getElementById('adminLog');
  const cards = document.getElementById('sourceCards');
  log.textContent = '// Caricamento status…';
  try {
    const res = await fetch(`${API_BASE}/fob/admin/cache/status?league=${LEAGUE}`, { headers: adminHeaders() });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    log.textContent = JSON.stringify(data, null, 2);
    renderSourceCards(data.sources || {});
  } catch (e) {
    log.textContent = '// Errore: ' + e.message;
  }
}

function renderSourceCards(sources) {
  const cards = document.getElementById('sourceCards');
  cards.innerHTML = Object.entries(sources).map(([name, s]) => `
    <div class="source-card">
      <div class="source-card-header">
        <span class="source-name">${esc(name)}</span>
        <span class="status-dot ${s.status === 'ok' ? 'ok' : s.status === 'error' ? 'error' : ''}"></span>
      </div>
      <div class="source-meta">${s.count ?? 0} builds · ${s.updated_at ? new Date(s.updated_at).toLocaleString('it-IT') : 'mai'}</div>
      ${s.status === 'error' ? `<div style="font-size:var(--text-xs);color:var(--error);margin-bottom:var(--space-2)">${esc(s.error || '')}</div>` : ''}
      <button class="source-refresh-btn" onclick="triggerRefresh('${name}')">↻ refresh</button>
    </div>`).join('');
}

async function triggerRefresh(source) {
  const log = document.getElementById('adminLog');
  log.textContent = `// Avvio refresh${source ? ' source: ' + source : ' (all)'}…`;
  try {
    const body = { league: LEAGUE, limit_per_source: 100 };
    if (source) body.sources = [source];
    const res = await fetch(`${API_BASE}/fob/admin/refresh`, {
      method: 'POST',
      headers: adminHeaders(),
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    log.textContent = JSON.stringify(data, null, 2);
    setTimeout(loadCacheStatus, 3000);
  } catch (e) {
    log.textContent = '// Errore: ' + e.message;
  }
}

function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
