[project]
name = "fob-frusta-oracle-builder"
version = "1.0.0"
description = "Build planner AI per Path of Exile 1 (FOB - Frusta Oracle Builder)"
authors = [{name = "RiccardoLongobardi", email = "ric.longobardi@outlook.it"}]
requires-python = ">=3.12"
readme = "README.md"
license = {text = "MIT"}

dependencies = [
    # Web framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.0",
    "pydantic-settings>=2.6",

    # HTTP client (scraping poe.ninja + PoE Trade API)
    "httpx>=0.28",
    "tenacity>=9.0",

    # HTML parsing (poe.ninja fallback scraping)
    "beautifulsoup4>=4.12",
    "lxml>=5.0",

    # DB
    "sqlalchemy>=2.0",

    # Scheduler (fetch periodico)
    "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.33",
    "ruff>=0.7",
    "mypy>=1.13",
]

[project.scripts]
fob = "backend.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
