[project]
name = "faustus-dashboard"
version = "0.1.0"
description = "Market intelligence desktop app for Faustus currency exchange (Path of Exile 1)"
authors = [{ name = "Riccardo Longobardi", email = "ric.longobardi@outlook.it" }]
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    # Core
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # HTTP client
    "httpx>=0.28",
    "tenacity>=9.0",              # retry/backoff helpers
    # DB
    "sqlalchemy>=2.0",
    # Scheduler
    "apscheduler>=3.10",
    # CLI
    "typer>=0.15",
    "rich>=13.9",                 # pretty CLI output
    # Desktop window (fase 4, ma metto la dep ora per non avere sorprese)
    "pywebview>=5.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.33",         # mock httpx in tests
    "ruff>=0.7",
    "mypy>=1.13",
]

[project.scripts]
faustus = "backend.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

# ---------------------------------------------------------------------------
# Tooling config
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "W",    # pycodestyle + pyflakes
    "I",              # isort
    "UP",             # pyupgrade
    "B",              # bugbear
    "SIM",            # simplify
    "RUF",            # ruff-specific
]
ignore = [
    "E501",           # line-too-long (deferred to formatter)
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
